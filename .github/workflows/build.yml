name: Build Multi-OS ASW

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ] # Roda ao criar tags como v1.0.0
  workflow_dispatch: # Permite execução manual pelo site do GitHub

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - name: Checkout do Código
      uses: actions/checkout@v4

    - name: Configurar Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Instalar Dependências do Sistema (Apenas Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-tk portaudio19-dev

    - name: Instalar Dependências do Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Executar Build com cx_Freeze
      run: python setup.py build

    - name: Compactar o Build (Windows)
      if: matrix.os == 'windows-latest'
      run: |
        Compress-Archive -Path build\ASW_Build\* -DestinationPath ASW-Windows.zip

    - name: Compactar o Build (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        tar -czvf ASW-Linux.tar.gz -C build/ASW_Build .

    - name: Compactar o Build (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        tar -czvf ASW-macOS.tar.gz -C build/ASW_Build .

    - name: Upload dos Artifacts (Disponível por 90 dias)
      uses: actions/upload-artifact@v4
      with:
        name: ASW-${{ matrix.os }}
        path: |
          ASW-Windows.zip
          ASW-Linux.tar.gz
          ASW-macOS.tar.gz
        retention-days: 90

    - name: Criar Release no GitHub (Apenas em Tags)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          ASW-Windows.zip
          ASW-Linux.tar.gz
          ASW-macOS.tar.gz
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
